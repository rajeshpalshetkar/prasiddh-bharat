<!--
Prasiddh Bharat reusable section page.
1. Replace __SECTION_TITLE__ with the Hindi section title.
2. Replace __PUBLIC_JSON_URL__ with the raw GitHub URL for that section's latest.json.
3. Paste into Blogger Page > HTML view.
4. Load the shared renderer from the public GitHub raw URL.
-->
<style>
.pb-section{max-width:900px;margin:0 auto;padding:18px 14px;color:#202124;font-family:Arial,sans-serif;line-height:1.65}
.pb-section h1{color:#17345b;border-bottom:3px solid #c69b3c;padding-bottom:12px}
.pb-section .pb-headline-item{padding:15px 0;border-bottom:1px solid #e5e7eb}
.pb-section .pb-headline-link{font-size:18px;font-weight:700;color:#17345b;text-decoration:none}
.pb-section .pb-headline-link:hover{text-decoration:underline}
.pb-section .pb-headline-meta{font-size:12px;color:#6b7280;margin-top:5px}
.pb-section .pb-load-more{display:block;margin:24px auto;padding:11px 24px;border:0;border-radius:5px;background:#17345b;color:#fff;font-weight:700;cursor:pointer}
.pb-section .pb-status{color:#6b7280;font-size:13px}
</style>

<div class="pb-section" data-pb-section data-data-url="__PUBLIC_JSON_URL__" data-page-size="20">
  <h1>__SECTION_TITLE__</h1>
  <p class="pb-status" data-pb-status>अपडेट लोड हो रहे हैं...</p>
  <div data-pb-list></div>
  <button class="pb-load-more" data-pb-load-more type="button" hidden>और देखें</button>
</div>
<script src="https://raw.githubusercontent.com/rajeshpalshetkar/prasiddh-bharat/main/assets/js/section-renderer.js"></script>
