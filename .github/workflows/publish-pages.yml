name: Publish Blogger Pages

on:
  workflow_dispatch:
    inputs:
      page_file:
        description: "JSON page file, e.g. pages/queue/all-sections.json"
        required: true
        type: string
      publish_confirm:
        description: "Type PUBLISH to publish this page publicly"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: prasiddh-bharat-page-publisher
  cancel-in-progress: false

jobs:
  publish-page:
    if: ${{ inputs.publish_confirm == 'PUBLISH' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish selected Blogger page
        env:
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          PAGE_FILE: ${{ inputs.page_file }}
        run: python scripts/publish_pages.py

      - name: Archive published page request
        run: |
          if [[ -n "$(git status --porcelain pages/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pages/
            git commit -m "chore: archive published Blogger page request"
            git push
          else
            echo "No page queue changes."
          fi

  require-confirmation:
    if: ${{ inputs.publish_confirm != 'PUBLISH' }}
    runs-on: ubuntu-latest
    steps:
      - name: Stop without publishing
        run: |
          echo "Publication cancelled. Re-run and type PUBLISH exactly to confirm."
          exit 1
