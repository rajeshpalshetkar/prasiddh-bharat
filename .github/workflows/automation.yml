name: Prasiddh Bharat Automation

on:
  schedule:
    # Main scheduler runs every 12 hours; section intervals are configured separately.
    - cron: "17 */12 * * *"
  workflow_dispatch:
    inputs:
      section_id:
        description: "Optional section ID (leave blank to process all due sections)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: prasiddh-bharat-automation
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect source updates
        env:
          SECTION_ID: ${{ inputs.section_id }}
        run: python scripts/main.py

      - name: Commit updated JSON data
        run: |
          if [[ -n "$(git status --porcelain data/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore: update automated content data"
            git push
          else
            echo "No data changes to commit."
          fi
