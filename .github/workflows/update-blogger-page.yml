name: Update Existing Blogger Page

on:
  workflow_dispatch:
    inputs:
      page_file:
        description: "Queued JSON file, e.g. pages/queue/update-all-sections.json"
        required: true
        type: string
      update_confirm:
        description: "Type UPDATE to update the existing page"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: prasiddh-bharat-page-updater
  cancel-in-progress: false

jobs:
  update-page:
    if: ${{ inputs.update_confirm == 'UPDATE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Update existing Blogger page
        env:
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          PAGE_FILE: ${{ inputs.page_file }}
        run: python scripts/update_blogger_page.py
      - name: Archive update request
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/
          git commit -m "chore: archive updated Blogger page request"
          git push

  require-confirmation:
    if: ${{ inputs.update_confirm != 'UPDATE' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Update cancelled. Type UPDATE exactly to confirm."
          exit 1
